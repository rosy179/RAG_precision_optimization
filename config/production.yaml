# config/production.yaml
# Profile: Production — full stack, highest accuracy
# Use for: enterprise Q&A, hallucination-critical applications, chat apps
# Accuracy: ~0.94 | Latency: ~2100ms | Cost: ~$0.000181/query

retrieval:
  type: hybrid                # BM25 + Semantic + RRF
  top_k: 3
  retrieve_depth: 20          # wider candidate pool for reranker
  chunk_size: 512
  chunk_overlap: 50
  embed_model: text-embedding-ada-002
  bm25_weight: 0.5
  semantic_weight: 0.5

reranking:
  enabled: true
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  # Alternative for higher accuracy: cross-encoder/ms-marco-MiniLM-L-12-v2
  batch_size: 32

query_expansion:
  enabled: false              # Off by default; enable for broad search use cases
  mode: combined              # multi_query | hyde | combined
  n_variants: 3

generation:
  use_cot: true
  cot_mode: structured        # structured | simple | citation
  model: gpt-4o-mini
  max_tokens: 600
  temperature: 0.0

optimization:
  cache_enabled: true
  cache_dir: cache
  batch_size: 10
  timeout_seconds: 15
  max_retries: 3
  backoff_base: 1.0           # exponential backoff base (seconds)

monitoring:
  enabled: true
  log_dir: logs
  alert_latency_ms: 5000
  alert_error_rate: 0.05
